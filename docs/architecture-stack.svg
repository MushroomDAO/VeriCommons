<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1180" width="1280" height="1180" role="img" aria-labelledby="title desc">
  <title id="title">VeriCore stack: consumers, orchestrator, provers, zkTLS, zkPass adapter trust</title>
  <desc id="desc">VeriCore sits between Task Plaza and credits. Backend-neutral means pluggable provers. zkTLS is a technique used by several provers. zkPass is a vendor prover we adapt with an explicit trust assumption. Delayed attribution is not zkTLS.</desc>

  <rect width="1280" height="1180" fill="#fafafa"/>

  <text x="40" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#18181b">VeriCore in the stack</text>
  <text x="40" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#52525b">Consumers already exist. VeriCore orchestrates prove / verify / issue. Provers are pluggable. zkPass is one vendor prover, not a peer of VeriCore.</text>

  <!-- L4 consumers -->
  <rect x="24" y="76" width="1232" height="118" rx="10" fill="#f4f4f5" stroke="#e4e4e7"/>
  <text x="40" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#71717a">L4  CONSUMERS    already exist, do not rebuild</text>

  <rect x="48" y="112" width="360" height="64" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="228" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#18181b">Task Plaza</text>
  <text x="228" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#71717a">create task · read PASS / FAIL / PENDING</text>

  <rect x="872" y="112" width="360" height="64" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="1052" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#18181b">Credits / Smart Accounts</text>
  <text x="1052" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#71717a">grant / debit after verdict  operations</text>

  <path d="M228 176 L228 214" stroke="#a1a1aa" stroke-width="1.5"/>
  <path d="M1052 176 L1052 214" stroke="#a1a1aa" stroke-width="1.5"/>
  <path d="M228 214 L1052 214" stroke="#a1a1aa" stroke-width="1.5"/>
  <path d="M640 214 L640 232" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arr)"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a1a1aa"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- L3 VeriCore -->
  <rect x="24" y="232" width="1232" height="196" rx="10" fill="#e8eef7" stroke="#93c5fd"/>
  <text x="40" y="254" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">L3  VERICORE    this repo · orchestrator · not a zkTLS implementation</text>
  <text x="40" y="274" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1e3a8a">Core value: one verdict for the plaza · swap provers without rewriting plaza/ledger · immediate + delayed in one state machine</text>

  <rect x="48" y="292" width="200" height="112" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="148" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">1  prove()</text>
  <text x="148" y="344" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#3f3f46">Prover = collect evidence</text>
  <text x="148" y="362" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#3f3f46">output RawProof</text>
  <text x="148" y="384" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#71717a">not the verifier</text>

  <rect x="268" y="292" width="200" height="112" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="368" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">2  verify()</text>
  <text x="368" y="344" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#3f3f46">Verifier = check proof</text>
  <text x="368" y="362" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#3f3f46">source · tamper · predicate</text>
  <text x="368" y="384" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#71717a">self-check or trust vendor SDK</text>

  <rect x="488" y="292" width="200" height="112" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="588" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">3  issue()</text>
  <text x="588" y="344" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#3f3f46">Issuer = our Evidence</text>
  <text x="588" y="362" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#3f3f46">what plaza / credits consume</text>
  <text x="588" y="384" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#71717a">formerly credential()</text>

  <rect x="728" y="292" width="500" height="112" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="978" y="318" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#047857">Delayed attribution  ·  not zkTLS</text>
  <text x="978" y="340" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#065f46">WeChat Moments / private channels: no HTTPS endpoint</text>
  <text x="978" y="360" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#065f46">issue channel / referral id ’ PENDING</text>
  <text x="978" y="380" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#065f46">qualified signup / contribution ’ PASS  (result proof)</text>
  <text x="978" y="396" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#047857">same issue() object · proofType = RESULT_ATTRIBUTION</text>

  <path d="M248 348 L268 348" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <path d="M468 348 L488 348" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrBlue)"/>

  <!-- L2 provers -->
  <rect x="24" y="448" width="1232" height="268" rx="10" fill="#f4f4f5" stroke="#e4e4e7"/>
  <text x="40" y="470" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#71717a">L2  PROVERS    backend-neutral backend = this row. VeriCore.prove() dispatches here.</text>
  <text x="40" y="488" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#3f3f46">Compatible objects: any engine that returns a proof we can map after verify. Self-hosted provers do not need a vendor to cooperate.</text>

  <!-- own / api -->
  <rect x="48" y="508" width="220" height="88" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="158" y="534" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Our Public Web prover</text>
  <text x="158" y="554" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1e3a8a">open-source · we operate</text>
  <text x="158" y="572" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1e3a8a">fetch + challenge + backlink</text>
  <text x="158" y="586" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#2563eb">we verify ourselves</text>

  <rect x="284" y="508" width="220" height="88" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="394" y="534" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Official API prover</text>
  <text x="394" y="554" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1e3a8a">GitHub / Discord OAuth</text>
  <text x="394" y="572" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1e3a8a">we call their API, we sign</text>
  <text x="394" y="586" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#2563eb">trust: GitHub + our oracle</text>

  <!-- zkTLS group -->
  <rect x="520" y="500" width="732" height="196" rx="10" fill="#fffbeb" stroke="#d97706" stroke-dasharray="5 4"/>
  <text x="536" y="520" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309">zkTLS = a TECHNIQUE at L2, not a product layer of our own</text>
  <text x="536" y="536" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#92400e">Several vendors implement it. VeriCore does not have to own a zkTLS stack.</text>

  <rect x="540" y="548" width="220" height="132" rx="8" fill="#fff" stroke="#d97706"/>
  <text x="650" y="572" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#92400e">TLSNotary / vlayer</text>
  <text x="650" y="592" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78350f">self-host notary possible</text>
  <text x="650" y="610" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78350f">we can be the prover</text>
  <text x="650" y="636" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#b45309">trust: our notary + TLS</text>
  <text x="650" y="654" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#a16207">open stack we can operate</text>

  <rect x="776" y="548" width="220" height="132" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="886" y="568" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#c2410c">zkPass  (vendor product)</text>
  <text x="886" y="588" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9a3412">their zkTLS prover</text>
  <text x="886" y="604" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9a3412">+ their verify network</text>
  <text x="886" y="620" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9a3412">+ their credential / login</text>
  <text x="886" y="644" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#c2410c">we ADAPT · we do not control</text>
  <text x="886" y="662" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#9a3412">trust their SDK verify = yes</text>

  <rect x="1012" y="548" width="220" height="132" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="1122" y="572" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#c2410c">Reclaim  (vendor)</text>
  <text x="1122" y="592" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9a3412">their attestor / zk-fetch</text>
  <text x="1122" y="616" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#c2410c">same pattern: adapter</text>
  <text x="1122" y="634" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#9a3412">trust their attestor set</text>
  <text x="1122" y="652" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#9a3412">watch AGPL on zk-fetch</text>

  <!-- L1 sources -->
  <rect x="24" y="736" width="1232" height="100" rx="10" fill="#fff" stroke="#e4e4e7"/>
  <text x="40" y="758" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#71717a">L1  SOURCES    facts in the world. No endpoint Ò cannot use zkTLS; use delayed attribution instead.</text>

  <rect x="48" y="772" width="170" height="48" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
  <text x="133" y="800" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#18181b">GitHub API / pages</text>
  <rect x="234" y="772" width="170" height="48" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
  <text x="319" y="800" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#18181b">Public websites</text>
  <rect x="420" y="772" width="170" height="48" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
  <text x="505" y="800" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#18181b">Email / SaaS HTTPS</text>
  <rect x="606" y="772" width="280" height="48" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="746" y="792" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" fill="#047857">WeChat Moments / private channels</text>
  <text x="746" y="808" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#065f46">no observable HTTPS ’ delayed path only</text>
  <rect x="902" y="772" width="330" height="48" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
  <text x="1067" y="800" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#18181b">On-chain state / other APIs</text>

  <!-- flow + zkPass product comparison -->
  <rect x="24" y="856" width="760" height="292" rx="10" fill="#fff" stroke="#e4e4e7"/>
  <text x="40" y="880" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#18181b">Flow  (what VeriCore always does)</text>

  <rect x="48" y="900" width="140" height="52" rx="6" fill="#e8eef7" stroke="#93c5fd"/>
  <text x="118" y="930" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" fill="#1d4ed8">prove</text>
  <rect x="220" y="900" width="140" height="52" rx="6" fill="#e8eef7" stroke="#93c5fd"/>
  <text x="290" y="930" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" fill="#1d4ed8">verify</text>
  <rect x="392" y="900" width="140" height="52" rx="6" fill="#e8eef7" stroke="#93c5fd"/>
  <text x="462" y="930" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" fill="#1d4ed8">issue</text>
  <rect x="564" y="900" width="196" height="52" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="662" y="930" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" fill="#1e40af">PASS / FAIL / PENDING</text>
  <path d="M188 926 L220 926" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <path d="M360 926 L392 926" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <path d="M532 926 L564 926" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrBlue)"/>

  <text x="48" y="978" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#3f3f46">Immediate: GitHub / Public Web / zkTLS vendor ’ prove now ’ verify now ’ issue ’ PASS</text>
  <text x="48" y="1000" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#3f3f46">Delayed: no prover can fetch Moments ’ skip zk proof ’ PENDING + channel id ’ later result ’ issue ’ PASS</text>
  <text x="48" y="1030" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" fill="#18181b">Could we build a zkPass-like product on VeriCore?</text>
  <text x="48" y="1050" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#3f3f46">Yes: add our own zkTLS prover + login UX on top of the same 3 steps.</text>
  <text x="48" y="1070" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#3f3f46">We do not need to. Plaza only needs the verdict. zkPass already packaged that vertical.</text>
  <text x="48" y="1098" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#3f3f46">Vendor adapter: we cannot re-run their TLS. After their SDK says OK, we issue OUR evidence</text>
  <text x="48" y="1116" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#3f3f46">with verifierSet = zkPass. That is an explicit trust assumption, recorded, not hidden.</text>

  <rect x="800" y="856" width="456" height="292" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="820" y="880" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#9a3412">zkPass as a vertical product</text>
  <text x="820" y="900" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9a3412">Same 3 steps, bundled with their engine + app</text>

  <rect x="828" y="916" width="400" height="36" rx="6" fill="#fff" stroke="#fdba74"/>
  <text x="1028" y="938" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#9a3412">their app: login / pass / email credential</text>
  <rect x="828" y="960" width="400" height="36" rx="6" fill="#fff" stroke="#fdba74"/>
  <text x="1028" y="982" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#9a3412">their issue: zkPass credential</text>
  <rect x="828" y="1004" width="400" height="36" rx="6" fill="#fff" stroke="#fdba74"/>
  <text x="1028" y="1026" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#9a3412">their verify: validator / TransGate SDK</text>
  <rect x="828" y="1048" width="400" height="36" rx="6" fill="#fff" stroke="#fdba74"/>
  <text x="1028" y="1070" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#9a3412">their prove: 3P-TLS zkTLS</text>
  <text x="828" y="1116" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9a3412">We plug in at verify-result, not inside their TLS.</text>
</svg>
