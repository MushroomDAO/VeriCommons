<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Three independent verifiers, one issue</title>
  <desc id="desc">RawProof is checked by three separately deployed verifier operators. A 2-of-3 quorum is required before a single issuer calls issue(). Consumers only read the ticket. Not three threads in one app.</desc>
  <rect width="1100" height="620" fill="#fafafa"/>
  <text x="32" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#18181b">Decentralized verify  2-of-3 then one issue()</text>
  <text x="32" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#52525b">Independent operators. Issuer is a separate role. Plaza / credits / 4337 still consume the ticket only. P5  not running in P1P3.</text>

  <rect x="32" y="80" width="200" height="70" rx="8" fill="#fff" stroke="#2563eb"/>
  <text x="132" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Prover</text>
  <text x="132" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#52525b">RawProof</text>

  <line x1="232" y1="115" x2="300" y2="115" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="300" y="72" width="500" height="250" rx="10" fill="#e8eef7" stroke="#2563eb"/>
  <text x="320" y="94" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">VERIFIER OPERATORS  separate hosts, separate keys</text>

  <rect x="324" y="112" width="140" height="80" rx="8" fill="#fff" stroke="#2563eb"/>
  <text x="394" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">Verifier A</text>
  <text x="394" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#52525b">our API / Public Web</text>
  <rect x="480" y="112" width="140" height="80" rx="8" fill="#fff" stroke="#2563eb"/>
  <text x="550" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">Verifier B</text>
  <text x="550" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#52525b">self-hosted TLSNotary</text>
  <rect x="636" y="112" width="140" height="80" rx="8" fill="#fff" stroke="#2563eb"/>
  <text x="706" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">Verifier C</text>
  <text x="706" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#52525b">vendor or third party</text>

  <rect x="420" y="220" width="260" height="80" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="550" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Quorum 2-of-3</text>
  <text x="550" y="274" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#52525b">fail closed if missing</text>

  <rect x="860" y="80" width="208" height="242" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="964" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">ISSUER  one issue()</text>
  <rect x="880" y="132" width="168" height="70" rx="8" fill="#fff" stroke="#059669"/>
  <text x="964" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#047857">issue()</text>
  <text x="964" y="182" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#065f46">our key or yours</text>
  <rect x="880" y="216" width="168" height="80" rx="8" fill="#fff" stroke="#059669"/>
  <text x="964" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#047857">One ticket</text>
  <text x="964" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#065f46">verifierSet A+B or A+C</text>
  <text x="964" y="284" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#065f46">trust labeled</text>

  <rect x="32" y="360" width="1036" height="220" rx="10" fill="#f4f4f5" stroke="#e4e4e7"/>
  <text x="48" y="384" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#71717a">CONSUMERS  same ticket, no vendor proof bytes</text>
  <rect x="48" y="404" width="230" height="56" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="163" y="438" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#18181b">Task Plaza / credits</text>
  <rect x="298" y="404" width="230" height="56" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="413" y="438" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#18181b">ERC-4337 validator</text>
  <rect x="548" y="404" width="230" height="56" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="663" y="438" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#18181b">Your app / custom issuer</text>
  <rect x="798" y="404" width="246" height="56" rx="8" fill="#fff" stroke="#d4d4d8"/>
  <text x="921" y="438" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#18181b">Optional ticket-hash registry</text>
  <text x="48" y="490" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#3f3f46">Deploy: N verifier workers (different orgs) + 1 issuer service. Not three copies of the plaza. Kernel already has verifierSet; quorum fan-out is P5.</text>
  <text x="48" y="512" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#3f3f46">EvidenceRegistry today stores our ticket hash. A verifier-key registry is a later extension, not the same contract.</text>
  <text x="48" y="548" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#71717a">See docs/Ecosystem.md</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a1a1aa"/>
    </marker>
  </defs>
</svg>
